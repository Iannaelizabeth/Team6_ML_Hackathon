<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathSnap Route Evaluator</title>
  <!-- Leaflet is vendored in static/vendor so the map library loads without internet.
       Only the background street tiles need a connection. -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <script src="vendor/leaflet/leaflet.js"></script>
  <style>
    :root {
      --bg: #f4f6f9; --panel: #ffffff; --border: #e1e6ee; --text: #1b2433; --muted: #66748a;
      --accent: #0f766e; --accent-soft: #e6f4f2;
      --gps: #2563eb; --route: #e4572e; --matched: #15803d; --network: #9aa5b5;
      font-family: "Segoe UI", system-ui, sans-serif; color: var(--text);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); }
    .app { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }

    /* Sidebar */
    aside { background: var(--panel); border-right: 1px solid var(--border); padding: 20px 16px;
            display: flex; flex-direction: column; gap: 14px; }
    .brand { font-size: 1.25rem; font-weight: 700; }
    .brand small { display: block; font-size: .78rem; font-weight: 400; color: var(--muted); margin-top: 2px; }
    .label { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    input[type=search] { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
    .decoder { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .decoder button { border: 0; background: transparent; padding: 8px 6px; font: inherit; font-size: .85rem; cursor: pointer; color: var(--muted); }
    .decoder button.active { background: var(--accent); color: white; }
    #trip-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    #trip-list button { width: 100%; text-align: left; border: 1px solid var(--border); background: var(--panel);
                        border-radius: 8px; padding: 10px 12px; font: inherit; cursor: pointer; display: flex;
                        justify-content: space-between; align-items: center; }
    #trip-list button:hover { border-color: var(--accent); }
    #trip-list button.active { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
    #trip-list button span { font-size: .75rem; color: var(--muted); font-weight: 400; }
    #health { font-size: .78rem; color: var(--muted); line-height: 1.4; }

    /* Main */
    main { padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .card strong { display: block; font-size: 1.5rem; margin: 4px 0 2px; }
    .card small { color: var(--muted); font-size: .75rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .panel-head h2 { margin: 0; font-size: 1.05rem; }
    #status { font-size: .85rem; color: var(--muted); }
    #status.error { color: #b42318; }
    #map { height: min(62vh, 600px); border-radius: 8px; background: #e9eef4; }
    .legend { background: white; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
              font-size: .8rem; line-height: 1.7; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    .legend i { display: inline-block; width: 18px; height: 4px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
    .legend i.dot { width: 10px; height: 10px; border-radius: 50%; margin-left: 4px; margin-right: 10px; }
    #metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    .metric { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
    .metric strong { display: block; font-size: 1.1rem; }
    .metric span { font-size: .78rem; color: var(--muted); }
    .busy { opacity: .55; pointer-events: none; }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); }
      #trip-list { max-height: 220px; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">PathSnap<small>Map-matching &amp; route reconstruction</small></div>
    <div>
      <div class="label" style="margin-bottom:6px">Decoder</div>
      <div class="decoder" role="group" aria-label="Decoder">
        <button type="button" data-decoder="hmm_classifier" class="active">Classifier + HMM</button>
        <button type="button" data-decoder="classifier_only">Classifier only</button>
      </div>
    </div>
    <div>
      <div class="label" style="margin-bottom:6px" id="trip-heading">Evaluation trips</div>
      <input type="search" id="search" placeholder="Find a trip…" aria-label="Find a trip">
    </div>
    <ul id="trip-list"><li class="label">Loading trips…</li></ul>
    <div id="health">Connecting to API…</div>
  </aside>

  <main>
    <div id="cards"></div>
    <section class="panel">
      <div class="panel-head">
        <h2 id="map-title">Route map</h2>
        <div id="status" role="status">Select a trip to reconstruct its route.</div>
      </div>
      <div id="map"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Server-side evaluation</h2></div>
      <div id="metrics"><span class="label">Metrics appear after a trip is matched.</span></div>
    </section>
  </main>
</div>

<script>
  // ---- API location -------------------------------------------------------
  // Two-laptop deployment: open this page on Laptop 2 with ?api=http://<laptop1-ip>:8000
  // When served by the API itself (or no ?api= given) requests go to the same origin.
  const API_BASE = (() => {
    const fromQuery = new URLSearchParams(window.location.search).get("api");
    let stored = null;
    try { stored = localStorage.getItem("pathsnap_api"); } catch {}
    const base = fromQuery || stored ||
      (window.location.protocol.startsWith("http") ? window.location.origin : "http://127.0.0.1:8000");
    if (fromQuery) { try { localStorage.setItem("pathsnap_api", fromQuery); } catch {} }
    return base.replace(/\/+$/, "");
  })();
  const api = path => `${API_BASE}${path}`;

  const $ = id => document.getElementById(id);
  const tripList = $("trip-list"), statusText = $("status"), cards = $("cards"), metrics = $("metrics");
  let trips = [], selectedTrip = null, decoder = "hmm_classifier", busy = false;

  const pct = v => v == null ? "N/A" : `${(v * 100).toFixed(1)}%`;
  const setStatus = (text, isError = false) => { statusText.textContent = text; statusText.classList.toggle("error", isError); };
  const toLatLng = p => [p[1], p[0]];  // API sends [lon, lat]

  // ---- Map ----------------------------------------------------------------
  let map = null, overlay = null;
  if (window.L) {
    map = L.map("map", { preferCanvas: true, zoomControl: true }).setView([52.0, 5.0], 7);
    const street = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    const light = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap &copy; CARTO"
    });
    map._baseLayers = { "Street map": street, "Light map": light };

    const legend = L.control({ position: "bottomleft" });
    legend.onAdd = () => {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML =
        `<div><i style="background:var(--network)"></i>Road network</div>
         <div><i style="background:var(--gps)"></i>GPS trajectory</div>
         <div><i style="background:var(--route);height:6px"></i>Reconstructed route</div>
         <div><i class="dot" style="background:var(--matched)"></i>Start</div>
         <div><i class="dot" style="background:#111827"></i>End</div>`;
      return div;
    };
    legend.addTo(map);
  } else {
    $("map").innerHTML = '<p style="padding:16px">Map library failed to load (static/vendor/leaflet missing).</p>';
  }
  let layerControl = null;

  function drawRoute(data) {
    if (!map) return;
    if (overlay) overlay.remove();
    if (layerControl) layerControl.remove();
    overlay = L.layerGroup().addTo(map);

    const network = L.polyline((data.road_network || []).map(seg => seg.map(toLatLng)),
      { color: "#9aa5b5", weight: 1.5, opacity: 0.7, interactive: false });
    const route = L.polyline(data.route_coordinates.map(toLatLng),
      { color: "#e4572e", weight: 7, opacity: 0.6 }).bindTooltip("Reconstructed route");
    const gpsLatLngs = data.gps_points.map(toLatLng);
    const gps = L.layerGroup([L.polyline(gpsLatLngs, { color: "#2563eb", weight: 2, opacity: 0.9 })
      .bindTooltip("GPS trajectory")]);
    const step = Math.max(1, Math.ceil(gpsLatLngs.length / 250));
    for (let i = 0; i < gpsLatLngs.length; i += step) {
      L.circleMarker(gpsLatLngs[i], { radius: 2, color: "#2563eb", weight: 1, fillOpacity: 1 }).addTo(gps);
    }
    const matched = L.layerGroup();
    const mstep = Math.max(1, Math.ceil(data.snapped_points.length / 250));
    for (let i = 0; i < data.snapped_points.length; i += mstep) {
      L.circleMarker(toLatLng(data.snapped_points[i]),
        { radius: 2.5, color: "#15803d", weight: 0, fillOpacity: 0.8 }).addTo(matched);
    }
    const ends = L.layerGroup();
    if (gpsLatLngs.length) {
      L.circleMarker(gpsLatLngs[0], { radius: 7, color: "white", weight: 2, fillColor: "#15803d", fillOpacity: 1 })
        .bindTooltip("Start").addTo(ends);
      L.circleMarker(gpsLatLngs[gpsLatLngs.length - 1], { radius: 7, color: "white", weight: 2, fillColor: "#111827", fillOpacity: 1 })
        .bindTooltip("End").addTo(ends);
    }
    // back to front: network, route band, GPS, start/end
    [network, route, gps, ends].forEach(layer => layer.addTo(overlay));

    layerControl = L.control.layers(map._baseLayers, {
      "Road network": network, "Reconstructed route": route, "GPS trajectory": gps,
      "Matched points": matched, "Start / end": ends
    }, { collapsed: true }).addTo(map);

    const bounds = L.latLngBounds([...gpsLatLngs, ...data.route_coordinates.map(toLatLng)]);
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [24, 24] });
  }

  // ---- Cards & metrics ------------------------------------------------------
  function renderCards(data) {
    const items = data ? [
      ["GPS observations", data.gps_points.length, "raw trajectory points"],
      ["Matched observations", data.matched_points, `of ${data.gps_points.length} GPS points`],
      ["Route arcs", data.route_arc_count, "road segments in route"],
      ["Unmatched", data.unmatched_points, "observations without an arc"],
      ["Pointwise accuracy", pct(data.evaluation?.pointwise_accuracy), "vs. server-side reference"],
      ["Route continuity", pct(data.evaluation?.route_continuity), `${data.evaluation?.n_discontinuities ?? 0} discontinuities`],
    ] : [
      ["GPS observations", "–", "raw trajectory points"], ["Matched observations", "–", ""],
      ["Route arcs", "–", ""], ["Unmatched", "–", ""], ["Pointwise accuracy", "–", ""], ["Route continuity", "–", ""],
    ];
    cards.replaceChildren(...items.map(([label, value, note]) => {
      const card = document.createElement("div");
      card.className = "card";
      const l = document.createElement("div"); l.className = "label"; l.textContent = label;
      const v = document.createElement("strong"); v.textContent = value;
      const n = document.createElement("small"); n.textContent = note;
      card.append(l, v, n);
      return card;
    }));
  }

  function renderMetrics(data) {
    const e = data.evaluation || {};
    const rows = [
      ["Pointwise accuracy", pct(e.pointwise_accuracy)],
      ["Candidate miss rate", pct(e.candidate_miss_rate)],
      ["Route precision", pct(e.route_precision)],
      ["Route recall", pct(e.route_recall)],
      ["Route F1", pct(e.route_f1)],
      ["Route mismatch", pct(e.route_mismatch_fraction)],
      ["Route continuity", pct(e.route_continuity)],
      ["Discontinuities", e.n_discontinuities ?? 0],
      ["Evaluable observations", e.evaluable_observations ?? 0],
      ["Sequence breaks", data.sequence_breaks],
      ["Unfilled route gaps", data.unfilled_route_gaps],
      ["Decoder runtime", `${data.runtime_ms.toFixed(1)} ms`],
    ];
    metrics.replaceChildren(...rows.map(([label, value]) => {
      const div = document.createElement("div"); div.className = "metric";
      const s = document.createElement("strong"); s.textContent = value;
      const c = document.createElement("span"); c.textContent = label;
      div.append(s, c);
      return div;
    }));
  }

  // ---- Trips ----------------------------------------------------------------
  function renderTrips() {
    const q = $("search").value.trim();
    const shown = trips.filter(t => t.includes(q));
    if (!shown.length) { tripList.innerHTML = '<li class="label">No matching trips.</li>'; return; }
    tripList.replaceChildren(...shown.map((id, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      const tag = document.createElement("span"); tag.textContent = `#${trips.indexOf(id) + 1}`;
      b.appendChild(tag);
      if (id === selectedTrip) b.classList.add("active");
      b.addEventListener("click", () => matchTrip(id));
      li.appendChild(b);
      return li;
    }));
  }

  async function matchTrip(id) {
    if (busy) return;
    busy = true; selectedTrip = id; renderTrips();
    document.querySelector("main").classList.add("busy");
    const label = decoder === "hmm_classifier" ? "classifier + HMM/Viterbi" : "classifier only";
    setStatus(`Reconstructing trip ${id} (${label})…`);
    try {
      let response;
      try {
        response = await fetch(api(`/api/trips/${encodeURIComponent(id)}/match?decoder=${decoder}`), { method: "POST" });
      } catch {
        throw new Error(`Cannot reach the API at ${API_BASE}. Is uvicorn running on Laptop 1?`);
      }
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Route reconstruction failed.");
      $("map-title").textContent = `Trip ${data.trip_id}`;
      drawRoute(data); renderCards(data); renderMetrics(data);
      setStatus(`Done · ${label} · ${data.runtime_ms.toFixed(0)} ms`);
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      busy = false;
      document.querySelector("main").classList.remove("busy");
    }
  }

  document.querySelectorAll(".decoder button").forEach(btn => btn.addEventListener("click", () => {
    decoder = btn.dataset.decoder;
    document.querySelectorAll(".decoder button").forEach(b => b.classList.toggle("active", b === btn));
    if (selectedTrip) matchTrip(selectedTrip);
  }));
  $("search").addEventListener("input", renderTrips);

  async function initialize() {
    renderCards(null);
    try {
      const [h, t] = await Promise.all([fetch(api("/api/health")), fetch(api("/api/trips"))]);
      if (!h.ok || !t.ok) throw new Error(`Backend at ${API_BASE} is unavailable.`);
      const health = await h.json(), tripData = await t.json();
      trips = tripData.trips;
      $("trip-heading").textContent = `${tripData.partition} trips (${trips.length})`;
      $("health").textContent = `API ${API_BASE} · ${health.model} · ${health.model_artifact} · radius ${health.radius_m} m`;
      renderTrips();
    } catch (err) {
      const msg = err instanceof TypeError
        ? `Cannot reach the API at ${API_BASE}. Open this page with ?api=http://<laptop1-ip>:8000`
        : err.message;
      $("health").textContent = msg;
      tripList.innerHTML = "";
      setStatus(msg, true);
    }
  }
  initialize();
</script>
</body>
</html>
